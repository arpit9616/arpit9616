<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LinkedIn Banner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1584px; height: 396px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
    color: #E6EDF7;
    background:
      radial-gradient(ellipse 700px 380px at 1250px 120px, rgba(56, 132, 255, 0.22), transparent 70%),
      radial-gradient(ellipse 500px 300px at 700px 420px, rgba(20, 184, 166, 0.14), transparent 70%),
      linear-gradient(120deg, #070B14 0%, #0B1424 55%, #0A1A2B 100%);
    position: relative;
  }
  /* subtle grid */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(148, 179, 230, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148, 179, 230, 0.06) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: linear-gradient(90deg, transparent 0%, #000 35%, #000 100%);
  }
  /* content sits right of the profile photo (which covers the bottom-left) */
  .content {
    position: absolute;
    left: 520px; right: 80px; top: 0; bottom: 0;
    display: flex; flex-direction: column; justify-content: center;
    align-items: flex-end; text-align: right;
  }
  .eyebrow {
    font-size: 17px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
    color: #5EEAD4; margin-bottom: 18px;
  }
  .line {
    font-size: 46px; font-weight: 700; line-height: 1.15; letter-spacing: -0.015em;
    color: #F5F8FC;
  }
  .line .accent {
    background: linear-gradient(90deg, #60A5FA, #2DD4BF);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .stats {
    display: flex; gap: 0; margin-top: 34px;
  }
  .stat {
    padding: 0 28px; border-left: 1px solid rgba(148, 179, 230, 0.25);
    text-align: right;
  }
  .stat:first-child { border-left: none; }
  .stat:last-child { padding-right: 0; }
  .stat .num { font-size: 30px; font-weight: 700; color: #FFFFFF; letter-spacing: -0.01em; }
  .stat .lbl { font-size: 18px; color: #A9B6C8; margin-top: 4px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="content">
    <div class="eyebrow">Engineering Leader · Founding Engineer</div>
    <div class="line">
      <div>I build <span class="accent">AI-native platforms</span></div>
      <div>and the teams that run them.</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="num">8+ yrs</div><div class="lbl">building at startups</div></div>
      <div class="stat"><div class="num">80%</div><div class="lbl">cloud cost cut</div></div>
      <div class="stat"><div class="num">1.2B+</div><div class="lbl">LLM tokens / day</div></div>
      <div class="stat"><div class="num">2B+</div><div class="lbl">requests / day</div></div>
    </div>
  </div>
</body>
</html>
